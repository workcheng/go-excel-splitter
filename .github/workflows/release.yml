name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 资源名称是自动更新的契约（见 updater.go 的 platformAssets），改名会让旧版本找不到更新
        include:
          - os: ubuntu-latest
            binary_name: excel-splitter-linux
            asset_name: excel-splitter-linux.tar.gz
          - os: macos-latest
            binary_name: excel-splitter-macos
            asset_name: excel-splitter-macos.tar.gz
          - os: windows-latest
            binary_name: excel-splitter-windows.exe
            asset_name: excel-splitter-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Download dependencies
        run: go mod download

      - name: Build Linux/macOS binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "dist/${{ matrix.binary_name }}" .
          chmod +x "dist/${{ matrix.binary_name }}"
          tar -czf "dist/${{ matrix.asset_name }}" -C dist "${{ matrix.binary_name }}"

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=${{ github.ref_name }}" -o "dist/${{ matrix.binary_name }}" .
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath "dist/${{ matrix.asset_name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt && cat checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 没有 checkout，gh 需要显式指定仓库
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" artifacts/* --generate-notes --verify-tag

  publish-gitee:
    name: Publish Gitee Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push release tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin dev
          git config http.https://gitee.com/.extraheader \
            "Authorization: Basic $(printf '12581:%s' "$GITEE_TOKEN" | base64 -w0)"
          for attempt in 1 2 3; do
            if timeout 90s git -c http.version=HTTP/1.1 push \
              https://gitee.com/12581/go-excel-splitter.git \
              "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt

      - name: Create Gitee release and upload assets
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/12581/go-excel-splitter"
          notes="$(gh release view "$TAG_NAME" --json body --jq .body)"
          release_json="$(curl -fsS --get \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            "$api/releases/tags/$TAG_NAME" || true)"
          release_id="$(jq -r '.id // empty' <<< "$release_json")"
          if [[ -z "$release_id" ]]; then
            payload="$(jq -n --arg tag "$TAG_NAME" --arg notes "$notes" \
              '{tag_name:$tag,name:$tag,body:$notes,target_commitish:"dev"}')"
            release_json="$(curl -fsS -X POST "$api/releases?access_token=$GITEE_TOKEN" \
              -H 'Content-Type: application/json' -d "$payload")"
            release_id="$(jq -r '.id' <<< "$release_json")"
          fi
          release_json="$(curl -fsS --get \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            "$api/releases/$release_id")"
          existing_files="$(jq -c '.assets // []' <<< "$release_json")"
          for asset in artifacts/*; do
            filename="$(basename "$asset")"
            if jq -e --arg name "$filename" 'any(.[]; .name == $name)' <<< "$existing_files" >/dev/null; then
              continue
            fi
            uploaded=false
            for attempt in 1 2 3 4; do
              if curl --http1.1 -fsS -H 'Expect:' --connect-timeout 30 --max-time 600 \
                -X POST "$api/releases/$release_id/attach_files?access_token=$GITEE_TOKEN" \
                -F "access_token=$GITEE_TOKEN" \
                -F "file=@$asset" >/dev/null; then
                uploaded=true
                break
              fi
              release_json="$(curl -fsS --get \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                "$api/releases/$release_id")"
              existing_files="$(jq -c '.assets // []' <<< "$release_json")"
              if jq -e --arg name "$filename" 'any(.[]; .name == $name)' <<< "$existing_files" >/dev/null; then
                uploaded=true
                break
              fi
              sleep 2
            done
            if [[ "$uploaded" != true ]]; then
              echo "Failed to upload Gitee release asset: $filename" >&2
              exit 1
            fi
            visible=false
            for verify_attempt in $(seq 1 12); do
              release_json="$(curl -fsS --get \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                "$api/releases/$release_id")"
              existing_files="$(jq -c '.assets // []' <<< "$release_json")"
              if jq -e --arg name "$filename" 'any(.[]; .name == $name)' <<< "$existing_files" >/dev/null; then
                visible=true
                break
              fi
              sleep 5
            done
            if [[ "$visible" != true ]]; then
              echo "Gitee release asset did not become visible: $filename" >&2
              exit 1
            fi
          done

          for asset in artifacts/*; do
            filename="$(basename "$asset")"
            if ! jq -e --arg name "$filename" 'any(.[]; .name == $name)' <<< "$existing_files" >/dev/null; then
              echo "Gitee release is missing asset: $filename" >&2
              exit 1
            fi
          done

      - name: Sync dev branch to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config http.https://gitee.com/.extraheader \
            "Authorization: Basic $(printf '12581:%s' "$GITEE_TOKEN" | base64 -w0)"
          for attempt in 1 2 3; do
            if timeout 90s git -c http.version=HTTP/1.1 push \
              https://gitee.com/12581/go-excel-splitter.git \
              refs/remotes/origin/dev:refs/heads/dev; then
              exit 0
            fi
            sleep 5
          done
          exit 1
