name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 资源名称是自动更新的契约（见 updater.go 的 platformAssets），改名会让旧版本找不到更新
        include:
          - os: ubuntu-latest
            binary_name: excel-splitter-linux
            asset_name: excel-splitter-linux.tar.gz
          - os: macos-latest
            binary_name: excel-splitter-macos
            asset_name: excel-splitter-macos.tar.gz
          - os: windows-latest
            binary_name: excel-splitter-windows.exe
            asset_name: excel-splitter-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Download dependencies
        run: go mod download

      - name: Build Linux/macOS binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "dist/${{ matrix.binary_name }}" .
          chmod +x "dist/${{ matrix.binary_name }}"
          tar -czf "dist/${{ matrix.asset_name }}" -C dist "${{ matrix.binary_name }}"

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=${{ github.ref_name }}" -o "dist/${{ matrix.binary_name }}" .
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath "dist/${{ matrix.asset_name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > checksums.txt && cat checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 没有 checkout，gh 需要显式指定仓库
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" artifacts/* --generate-notes --verify-tag
